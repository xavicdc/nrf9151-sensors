[platformio]
; Short build dir to avoid Windows MAX_PATH limits in the TF-M/oberon build
build_dir = C:/N/build

[env:nrf9151_sma_dk]
platform = nordicnrf91
board = nrf9151_sma_dk

; nRF Connect SDK paths (workspace + toolchain) and target board
ncs_workspace = C:/Users/jcano23/nRF1
ncs_toolchain = C:/ncs/toolchains/936afb6332
nrf91_board = nrf9151dk/nrf9151/ns

monitor_speed = 115200
